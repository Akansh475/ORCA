t: 4px; background-color: #333; border-radius: 50%; }#rounded::middle { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(0deg); width: 20px; height: 4px; background-color: #333; border-radius: 50%; }#menu-icons { margin: 0 auto; }@media (max-width: 768px) { #menu-icons { flex-direction: column; }#menu-icons div { width: 100%; } }</style></head><body><h1>Hamburger Menu Icons</h1><div id="menu-icons"><div id="classic"> Classic 3-line </div><div id="animated"> Animated X on hover </div><div id="rounded"> Rounded bars </div></div></body></html>
