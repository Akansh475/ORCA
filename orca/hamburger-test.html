<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Hamburger Menu Icons</title><style>body { display: flex; flex-direction: column; align-items: center; padding: 20px;}.hamburger { width: 50px; height: 50px; border: none; background-color: transparent; cursor: pointer;}.hamburger::before, .hamburger::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #333;}.hamburger::before { width: 100%; height: 2px; transform: translate(-50%, -50%) rotate(0deg);}.hamburger::after { width: 100%; height: 2px; transform: translate(-50%, -50%) rotate(0deg);}.hamburger.active::before { transform: translate(-50%, -50%) rotate(45deg);}.hamburger.active::after { transform: translate(-50%, -50%) rotate(-45deg);}.hamburger-1 { display: inline-block; margin: 10px;}.hamburger-1::before, .hamburger-1::after { background-color: #333;}.hamburger-2 { display: inline-block; margin: 10px;}.hamburger-2::before { width: 100%; height: 2px; background-color: #333;}.hamburger-2::after { width: 100%; height: 2px; background-color: #333;}.hamburger-2:hover::before { transform: translate(-50%, -50%) rotate(45deg);}.hamburger-2:hover::after { transform: translate(-50%, -50%) rotate(-45deg);}.hamburger-3 { display: inline-block; margin: 10px;}.hamburger-3::before, .hamburger-3::after { background-color: #333;}.hamburger-3::before { width: 80%; height: 2px;}.hamburger-3::after { width: 80%; height: 2px;}.hamburger-3:hover::before { transform: translate(-50%, -50%) rotate(45deg);}.hamburger-3:hover::after { transform: translate(-50%, -50%) rotate(-45deg);}</style></head><body><h1>Hamburger Menu Icons</h1><button class='hamburger hamburger-1' onclick='this.classList.toggle("active");'>Classic 3-line</button><button class='hamburger hamburger-2' onclick='this.classList.toggle("active");'>Animated X on hover</button><button class='hamburger hamburger-3' onclick='this.classList.toggle("active");'>Rounded bars</button></body></html>
